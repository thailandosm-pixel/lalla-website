# Accessibility regression check.
# Serves the site the way GitHub Pages does and runs axe-core over
# every page template. Fails the build on any WCAG 2.1 AA violation.
name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install axe + puppeteer
        run: |
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install --no-audit --no-fund \
            puppeteer@23 @axe-core/puppeteer@4 http-server@14

      - name: Serve the site
        run: |
          npx http-server . -p 8080 --silent &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/index.html >/dev/null && break
            sleep 1
          done

      - name: Run axe-core
        run: node .github/scripts/a11y.mjs
